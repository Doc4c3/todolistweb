<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Todo 列表 V2.0</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #f0f2f5;
    font-family: "Microsoft YaHei", "Source Han Sans SC", Arial, sans-serif;
    font-size: 14px; line-height: 1.6; color: #1a1a1a;
    display: flex; justify-content: center; padding: 40px 16px;
  }
  .todo-app {
    width: 100%; max-width: 560px; background: #fff;
    padding: 32px 36px; box-shadow: 0 2px 12px rgba(0,0,0,.08);
  }
  h1 { font-size: 22px; color: #1F3864; border-bottom: 3px solid #1F3864; padding-bottom: 8px; margin-bottom: 16px; }
  .input-row { display: flex; gap: 8px; margin-bottom: 16px; }
  #todo-input {
    flex: 1; padding: 8px 12px; font-size: 14px;
    border: 1px solid #ccc; border-radius: 4px; font-family: inherit;
  }
  #todo-input:focus { outline: none; border-color: #1F3864; }
  #add-btn {
    padding: 8px 20px; font-size: 14px; border: none; border-radius: 4px;
    background: #1F3864; color: #fff; cursor: pointer;
  }
  #add-btn:hover { background: #2a4a80; }
  #todo-list { list-style: none; }
  #todo-list li {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 10px 12px; margin-bottom: 6px; background: #f7f9fc;
    border-left: 3px solid #1F3864; border-radius: 2px;
    overflow-wrap: anywhere; cursor: pointer;
  }
  /* 已完成：置灰 + 删除线 */
  #todo-list li.done {
    color: #999; text-decoration: line-through;
    border-left-color: #c0c4cc; background: #fafafa;
  }
  .del-btn {
    flex: none; width: 24px; height: 24px; line-height: 1;
    border: none; border-radius: 4px; background: #e8ebf0;
    color: #666; font-size: 14px; cursor: pointer;
  }
  .del-btn:hover { background: #f3d6d6; color: #b91c1c; }
  .empty-tip { color: #999; font-size: 13px; text-align: center; padding: 12px 0; }
</style>
</head>
<body>
<div class="todo-app">
  <h1>Todo 列表 <small style="font-size:12px;color:#666;">V2.0 数据驱动版</small></h1>
  <div class="input-row">
    <input id="todo-input" type="text" placeholder="输入待办事项，回车或点击添加">
    <button id="add-btn">添加</button>
  </div>
  <ul id="todo-list"></ul>
  <p class="empty-tip" id="empty-tip">暂无待办事项</p>
</div>
<script src="app.js"></script>
</body>
</html>
